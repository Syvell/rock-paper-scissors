<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Rock Paper Scissors Best of Five</title>
        <script src="rps.js" defer></script>
    </head>
    <body>
        <div class="container">
            <h1>Rock Paper Scissors Challange</h1>
            <div id="rps-text" class="text">Lets play some Rock Paper Scissors! Select a button and have some fun!</div>
            <button id="rock-btn">Rock</button>
            <button id="paper-btn">Paper</button>
            <button id="scissors-btn">Scissors</button>
            <div>
                <h2>Score Counter:</h2>
                <p id="score"></p>
            </div>
        </div>
    </body>
</html>
