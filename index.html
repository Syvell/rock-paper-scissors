<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Rock Paper Scissors Best of Five</title>
        <script src="rps.js" defer></script>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                background-color: rgb(88, 88, 145);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .container {
                background-color: rgb(231, 231, 220);
                display: block;
                padding: 2rem;
                min-width: 80vw;
            }

            h1 {
                font-size: 32px;
                padding: 2rem 0;
            }
            
            .center {
                text-align: center;
            }

            .text {
                padding: 1rem;
            }

            div.box {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .box button {
                width: 30%;
                border-radius: 10px;
                background-color: rgb(88, 88, 145);
                color: rgb(231, 231, 220);
                padding: 20px;
            }

            .score-counter {
                margin: 2rem 0;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="center">Rock Paper Scissors Challange</h1>
            <div id="rps-text" class="text">Lets play some Rock Paper Scissors! Select a button and have some fun! Remember it is best three out of five.</div>
            <div class="box">
                <button id="rock-btn">Rock</button>
                <button id="paper-btn">Paper</button>
                <button id="scissors-btn">Scissors</button>
                <button id="replay" style="display: none;">Replay</button>
            </div>
            <div class="score-counter center">
                <h2>Score Counter:</h2>
                <p id="score"></p>
            </div>
        </div>
    </body>
</html>
